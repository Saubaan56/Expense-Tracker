<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ledger — Expense Tracker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <h1>Ledger</h1>

  <div class="balance-card">
    <div class="balance-label">BALANCE</div>
    <div class="balance-amount" id="balance">₹0.00</div>
  </div>

  <div class="budget-card" id="budget-card" style="display:none;">
    <div class="balance-label">BUDGET</div>
    <div class="budget-row">
      <div><span class="budget-num" id="budget-total"></span><span class="budget-cap">Budget</span></div>
      <div><span class="budget-num" id="budget-spent"></span><span class="budget-cap">Spent</span></div>
      <div><span class="budget-num" id="budget-remaining"></span><span class="budget-cap">Remaining</span></div>
    </div>
    <button type="button" class="link-btn" id="edit-budget-btn">Edit budget</button>
    <button type="button" class="link-btn" id="remove-budget-btn">Turn off</button>
  </div>

  <div id="budget-setup">
    <button type="button" class="link-btn" id="show-budget-form-btn">+ Set a budget (optional)</button>
  </div>
  <form id="budget-form" style="display:none;">
    <div class="full">
      <label for="budget-input">Initial budget</label>
      <input type="number" id="budget-input" step="0.01" placeholder="e.g. 10000">
    </div>
    <button type="submit" class="add-btn">Save budget</button>
    <div class="form-error full" id="budget-form-error" style="display:none;"></div>
  </form>

  <form id="expense-form">
    <div class="full">
      <label for="desc">Description</label>
      <input type="text" id="desc" placeholder="Coffee, rent, freelance payment…" required>
    </div>
    <div>
      <label for="amount">Amount</label>
      <input type="number" id="amount" step="0.01" placeholder="0.00" required>
    </div>
    <div>
      <label for="type">Type</label>
      <select id="type">
        <option value="expense">Expense</option>
        <option value="income">Income</option>
      </select>
    </div>
    <div class="full">
      <label for="category">Category</label>
      <select id="category">
        <option>Food</option>
        <option>Transport</option>
        <option>Bills</option>
        <option>Fun</option>
        <option>Shopping</option>
        <option>Health</option>
        <option>Other</option>
      </select>
    </div>
    <button type="submit" class="add-btn">Add entry</button>
    <div class="form-error full" id="form-error" style="display:none;"></div>
  </form>

  <div class="filter-row">
    <label for="category-filter">Show</label>
    <select id="category-filter">
      <option value="All">All categories</option>
      <option>Food</option>
      <option>Transport</option>
      <option>Bills</option>
      <option>Fun</option>
      <option>Shopping</option>
      <option>Health</option>
      <option>Other</option>
    </select>
  </div>

  <ul id="expense-list"></ul>
  <div class="empty" id="empty-msg">No entries yet — add your first one above.</div>
</div>

<style src="script.js"></style>
</body>
</html>
